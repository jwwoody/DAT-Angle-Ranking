{% extends 'base.html' %}

{% block head %}
    <title>Free DAT Angle Ranking Generator | DAT Angle Ranking Practice Tool</title>
    <meta name="description" content="Set your difficulty level for DAT angle ranking practice. Choose angle differences from 1-36 degrees to customize your perceptual ability test preparation.">
    <style>
        .ad-container {
            max-width: 100%;
            margin: 1.5rem auto;
            text-align: center;
            padding: 0 1rem;
            position: relative;
        }
        .responsive-ad {
            display: block;
            margin: 0 auto;
        }
    </style>
{% endblock %}

{% block body %}
<div class="center-container">
    <div class="modern-card">
        <!-- Top Ad -->
        <div class="ad-container">
            <ins class="adsbygoogle responsive-ad"
                 style="display:block"
                 data-ad-client="ca-pub-4473065776641796"
                 data-ad-slot="1814730763"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
        
        <h1>Choose Angle Difference</h1>
        {% if error %}
        <div role="alert" style="color: var(--error-color); margin-bottom: 1rem; font-weight: 500;">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/">
            <div class="form-group">
                <p><label for="quantity">I want a <input type="number" name="variance" id="quantity" min="1" max="36" value="30" step="1" pattern="\\d+" inputmode="numeric" required aria-describedby="variance-hint"> degree difference between angles.</label><br><span id="variance-hint" class="muted-text" style="font-size:0.97em;">(Enter a whole number between 1 and 36)</span></p>
            </div>
            <input class="btn btn-primary" type="submit" value="Submit">
        </form>
        
        <!-- Bottom Ad -->
        <div class="ad-container">
            <ins class="adsbygoogle responsive-ad"
                 style="display:block"
                 data-ad-client="ca-pub-4473065776641796"
                 data-ad-slot="8592067118"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>
</div>
{% endblock %}
